; JC4827W543C  (ESP32-S3-WROOM-1 N4R8, NV3041A 480x272 QSPI LCD, GT911 touch)
; UI is generated by EEZ Studio into src/ui (flow enabled). EEZ Build overwrites src/ui:
; permanent fixes go elsewhere (see AGENTS.md). User settings: include/app_config.h

[platformio]
; Plain "pio run -t upload" = USB (COM7). OTA: add "-e jc4827w543c_ota"
default_envs = jc4827w543c
; Keep build output out of the project folder (cloud-sync churn + Windows 260-char path limit)
build_dir = ${sysenv.USERPROFILE}/.pio-builds/jc4827w543c/build
libdeps_dir = ${sysenv.USERPROFILE}/.pio-builds/jc4827w543c/libdeps

[env:jc4827w543c]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 N4R8: 4MB QIO flash + 8MB OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; Two 1.875MB app slots so OTA can write the new firmware beside the running one
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; EEZ eez-flow.h ignores -Wdangling-pointer (GCC 12+), unknown to this GCC 8 toolchain
    -Wno-pragmas
    -DBOARD_HAS_PSRAM
    ; USB-C is the ESP32-S3 native USB (USB-JTAG/serial, VID 303A) -> Serial over USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL: use include/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; EEZ generated code includes <lvgl/lvgl.h> and <lvgl/src/...>
    -I"${platformio.libdeps_dir}/${this.__env__}"

lib_deps =
    ; Must match the LVGL version selected in EEZ Studio (Settings > General > LVGL version)
    lvgl/lvgl@9.5.0
    moononournation/GFX Library for Arduino@1.4.9

; Upload over WiFi (OTA must be enabled on the WIFI screen):  pio run -e jc4827w543c_ota -t upload
[env:jc4827w543c_ota]
extends = env:jc4827w543c
upload_protocol = espota
; = WIFI_HOSTNAME in include/app_config.h (or use the IP shown on the WIFI screen)
; "No response from device": check the WIFI screen shows OTA Ready, retry, or use --upload-port <IP>
upload_port = touchscreen.local
; If OTA_PASSWORD is set in app_config.h:
; upload_flags = --auth=<password>
